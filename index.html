<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welche Kleidung tragen Sie wann oder wo?</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#3a1530;--bg2:#5a2150;--ink:#2a1230;--der:#2f6fed;--die:#e0408f;--das:#1fa968;--gold:#ffc83d;--ok:#22c55e;--no:#ef4444}
*{box-sizing:border-box;margin:0}
body{font-family:'Fredoka',system-ui,sans-serif;background:radial-gradient(circle at 80% 0,#8a2d6b 0,var(--bg) 55%);color:#fff;padding:16px 16px 40px;min-height:100vh;font-size:1.05rem}
.wrap{max-width:900px;margin:0 auto}
button{font-family:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:clamp(1.3rem,3.6vw,2rem)}
.snd{background:var(--bg2);color:#fff;border-radius:999px;padding:8px 16px;font-weight:600;font-size:1rem}
.steps{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.dot{flex:1;min-width:96px;background:var(--bg2);color:#fff;border-radius:12px;padding:8px 6px;font-size:.9rem;font-weight:600;opacity:.65}
.dot.on{background:var(--gold);color:var(--ink);opacity:1}.dot.done{opacity:1;background:#2c7a55}
.panel{background:var(--bg2);border-radius:26px;padding:20px}
.panel h2{font-size:clamp(1.25rem,3.4vw,1.7rem);margin-bottom:8px}
.panel p{margin-bottom:12px}
.task{background:#fff;color:var(--ink);border-radius:20px;padding:16px 18px;font-size:1.25rem;font-weight:600;line-height:1.55;margin-bottom:14px}
.task b{display:block;font-size:1.45rem;margin-bottom:6px}
.btn{background:var(--gold);color:var(--ink);font-weight:700;font-size:1.1rem;border-radius:14px;padding:11px 22px;box-shadow:0 4px 0 #c8962a}
.btn.sec{background:#fff;box-shadow:0 4px 0 #d9c4e6}
.btn:disabled{opacity:.4}
.places{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.pc{background:#fff;color:var(--ink);border-radius:22px;padding:12px;text-align:center;border-bottom:6px solid var(--gold)}
.pc .em{font-size:2rem}.pc .pn{font-weight:700;margin:2px 0 4px}
.pic{height:90px;display:flex;align-items:center;justify-content:center;font-size:62px;line-height:1}
.pic img{max-height:100%;max-width:90%;object-fit:contain}.pic svg{height:76px}
.lab{font-weight:600}.lab b{color:#fff;background:var(--c);border-radius:8px;padding:0 6px}
.der{--c:var(--der)}.die{--c:var(--die)}.das{--c:var(--das)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.chip{background:#fff;color:var(--ink);border-radius:999px;padding:9px 15px;font-weight:600;border-bottom:4px solid #d9c4e6}
.chip.on{background:var(--gold);border-color:#c8962a}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:6px 0 12px}
.it{background:#fff;color:var(--ink);border-radius:16px;padding:6px 4px;font-size:.92rem;font-weight:600;border-bottom:5px solid var(--c,#ccc)}
.it .pic{height:54px;font-size:38px}.it .pic svg{height:44px}
.it.on{outline:4px solid var(--gold);background:#fff7d6}
.sum{background:#00000035;border-radius:16px;padding:10px 14px;margin-top:8px;line-height:1.7}
.sum b{color:var(--gold)}
.tb{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px;margin:12px 0}
.tb div{background:#fff;color:var(--ink);border-radius:14px;padding:10px 6px;text-align:center;font-weight:600}
.tb .h{background:#00000040;color:#fff}
.tb .der{border-bottom:5px solid var(--der)}.tb .die{border-bottom:5px solid var(--die)}.tb .das{border-bottom:5px solid var(--das)}.tb .pl{border-bottom:5px solid var(--gold)}
.tb mark{background:var(--der);color:#fff;border-radius:8px;padding:1px 8px}
.ex{background:linear-gradient(#ffa73a,#e9791e);border-radius:18px;padding:14px 18px;font-weight:600;font-size:1.15rem;margin:8px 0;line-height:1.6;color:#fff;width:100%;text-align:left}
input[type=text]{font-family:inherit;font-size:1.1rem;padding:10px 14px;border-radius:12px;border:3px solid #d9c4e6;width:100%;max-width:300px;color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.big{background:#fff;color:var(--ink);border-radius:22px;padding:14px;margin:0 auto 12px;max-width:560px;text-align:center}
.big .pic{height:130px;font-size:90px}.big .pic svg{height:110px}
.big .sent{font-size:clamp(1.1rem,3vw,1.45rem);font-weight:700;line-height:1.5}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:460px;margin:0 auto}
.opt{background:#fff;color:var(--ink);border-radius:18px;padding:14px 6px;font-size:1.3rem;font-weight:600;border-bottom:5px solid #d9c4e6}
.opt.ok{background:var(--ok);color:#fff;border-color:#15803d}.opt.no{background:var(--no);color:#fff;border-color:#b91c1c}
.fb{min-height:32px;font-size:1.2rem;font-weight:700;margin:10px 0;text-align:center}
.prog{height:10px;background:#00000050;border-radius:9px;overflow:hidden;margin-bottom:14px}.prog i{display:block;height:100%;background:var(--gold)}
.tell{background:#fff;color:var(--ink);border-radius:18px;padding:12px 16px;margin-bottom:10px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tell .t{font-size:1.15rem;font-weight:700;line-height:1.5;flex:1;min-width:200px}
.tell mark{background:var(--gold);border-radius:6px;padding:0 5px}
.tell small{display:block;font-weight:600;opacity:.7}
nav.foot{display:flex;justify-content:space-between;margin-top:16px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head>
<body><div class="wrap">
<header><h1>🧥 Welche Kleidung tragen Sie wann oder wo?</h1><button class="snd" id="snd" aria-pressed="true">🔊 Ton an</button></header>
<div class="steps" id="steps"></div>
<main id="main"></main>
<nav class="foot"><button class="btn sec" id="bk">Zurück</button><button class="btn" id="nx">Weiter</button></nav>
</div>

/* 3 */
function s3(){
 $('#main').innerHTML=`<div class="panel"><h2>Schritt 3: Mit dem Wörterbuch ergänzen</h2><p>Suche ein neues Wort im Wörterbuch. Schreibe es hier.</p>
 <div class="row"><input type="text" id="nw" placeholder="z. B. Badeanzug" aria-label="Neues Wort"></div>
 <p>Welcher Artikel?</p><div class="chips">${['der','die','das','pl'].map(a=>`<button class="chip ${cArt===a?'on':''}" data-a="${a}">${a==='pl'?'die (Plural)':a}</button>`).join('')}</div>
 <p>Wann oder wo?</p><div class="chips">${PLACES.map((p,i)=>`<button class="chip ${cPl===i?'on':''}" data-p="${i}">${p.e} ${p.n}</button>`).join('')}</div>
 <button class="btn" id="add">Hinzufügen ➕</button>
 <div class="sum">${PLACES.map((p,i)=>`<div><b>${p.n}:</b> ${C[i].map(x=>da(x)+' '+x.w).join(', ')||'–'}</div>`).join('')}</div></div>`;
 document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{sfx.tap();const v=$('#nw').value;cArt=b.dataset.a;s3();$('#nw').value=v});
 document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{sfx.tap();const v=$('#nw').value;cPl=+b.dataset.p;s3();$('#nw').value=v});
 $('#add').onclick=()=>{const w=$('#nw').value.trim();if(!w){$('#nw').focus();return}sfx.ok();C[cPl].push({a:cArt,w,custom:true});say((cArt==='pl'?'die':cArt)+' '+w);s3()};
}
/* 4 */
function s4(){
 $('#main').innerHTML=`<div class="panel"><h2>Schritt 4: Die Regel</h2><p>Nach <b>tragen</b> steht der Akkusativ. Nur <b>der</b>-Wörter ändern sich.</p>
 <div class="tb"><div class="h">Das ist …</div><div class="h">Ich trage …</div><div class="h">Ich trage … nicht</div>
 <div class="der">der Anzug</div><div class="der"><mark>einen</mark> Anzug</div><div class="der"><mark>keinen</mark> Anzug</div>
 <div class="die">die Krawatte</div><div class="die">eine Krawatte</div><div class="die">keine Krawatte</div>
 <div class="das">das Kleid</div><div class="das">ein Kleid</div><div class="das">kein Kleid</div>
 <div class="pl">die Sportschuhe (Plural)</div><div class="pl">– Sportschuhe</div><div class="pl">keine Sportschuhe</div></div>
 <button class="ex" id="m">Bei der Arbeit trage ich meistens einen Anzug, aber keine Krawatte.</button></div>`;
 $('#m').onclick=()=>{sfx.tap();say($('#m').textContent)};
}
/* 5 */
let Q,qi,rt,lock;
function s5(){
 Q=[];C.forEach((a,i)=>a.forEach(x=>Q.push({p:PLACES[i].n,x})));Q=Q.slice(0,8);
 Q.push({p:'Bei der Arbeit',x:f('Anzug'),y:f('Krawatte')});qi=0;rt=0;q5();
}
function q5(){
 if(qi>=Q.length){const ok=rt===Q.length;ok?sfx.win():sfx.tap();$('#main').innerHTML=`<div class="panel" style="text-align:center"><h2>${ok?'Fantastisch! 🏆':'Sehr gut! ⭐'}</h2><p>${rt} von ${Q.length} richtig</p><button class="btn" id="ag">Nochmal</button></div>`;$('#ag').onclick=s5;return}
 lock=false;const {p,x,y}=Q[qi],t=y||x,g=gk(t),r=y?NEG[g]:AFF[g],pool=y?['kein','keine','keinen']:g==='pl'?['–','eine','einen']:['ein','eine','einen'];
 const line=y?`${p} trage ich meistens ${nm(x)}, aber ___ ${y.w}.`:`${p} trage ich meistens ___ ${x.w}.`,full=y?`${p} trage ich meistens ${nm(x)}, aber ${NEG[gk(y)]} ${y.w}.`:sentOne(p,x);
 $('#main').innerHTML=`<div class="panel"><h2>Schritt 5: Üben</h2><div class="prog"><i style="width:${qi/Q.length*100}%"></i></div><p style="text-align:center">Ergänze den Satz.</p>
 <div class="big"><div class="pic">${pic(t)}</div><div class="sent">${line}</div></div>
 <div class="opts">${sh(pool).map(o=>`<button class="opt" data-ok="${o===r?1:0}">${o}</button>`).join('')}</div><div class="fb" id="fb"></div><div style="text-align:center" id="n"></div></div>`;
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(lock)return;lock=true;const ok=b.dataset.ok==='1';
  document.querySelectorAll('.opt').forEach(o=>{o.disabled=true;if(o.dataset.ok==='1')o.classList.add('ok')});
  if(ok){rt++;sfx.ok();$('#fb').textContent='Richtig! 🎉'}else{b.classList.add('no');sfx.no();$('#fb').textContent='Richtig: '+full}
  setTimeout(()=>say(full),500);$('#n').innerHTML=`<button class="btn" id="nb">${qi===Q.length-1?'Fertig':'Weiter'}</button>`;$('#nb').onclick=()=>{qi++;q5()};$('#nb').focus()});
}
/* 6 */
function s6(){
 const rows=PLACES.map((p,i)=>C[i].length?`${p.n} trage ich meistens ${listTxt(C[i].map(nm))}.`:null).filter(Boolean);
 $('#main').innerHTML=`<div class="panel"><h2>Schritt 6: Erzählen Sie dann</h2><p>Lies jeden Satz laut. Dann sag deine eigenen Sätze.</p>
 ${rows.map(r=>`<div class="tell"><div class="t">${r}</div><button class="btn sec" data-t="${r}">🔊</button></div>`).join('')}
 <div class="tell"><div class="t"><small>Beispiel aus dem Buch</small>Bei der Arbeit trage ich meistens einen Anzug, aber keine Krawatte.</div><button class="btn sec" data-t="Bei der Arbeit trage ich meistens einen Anzug, aber keine Krawatte.">🔊</button></div></div>`;
 document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{sfx.tap();say(b.dataset.t)});
}
function render(){frame();[s1,s2,s3,s4,s5,s6][s]();window.scrollTo(0,0)}
render();
</script></body></html>
